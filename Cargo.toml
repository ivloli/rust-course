[workspace]
resolver = "2"
members = [
    "ch01_variables",
    "ch02_control_flow",
    "ch03_ownership",
    "ch04_structs_enums",
    "ch05_collections",
    "ch06_errors",
    "ch07_traits_generics",
    "ch08_modules",
    "ch09_threads",
    "ch10_async_tokio",
    "ch11_networking",
    "ch12_axum_basics",
    "ch13_axum_advanced",
    "ch14_agent_server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
